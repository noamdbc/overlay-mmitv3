name: Build & Publish Release (.exe, .dmg & .streamDeckPlugin)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix streamdeck-plugin install

      - name: Build Stream Deck Plugin & macOS DMG
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build:streamdeck
          npx electron-builder --mac --publish never
          VERSION=$(node -p "require('./package.json').version")
          cp streamdeck-plugin/dist/fr.mmitv.overlay.streamDeckPlugin "dist/fr.mmitv.overlay-v${VERSION}.streamDeckPlugin"

      - name: Upload macOS & Stream Deck Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mac-and-streamdeck-artifacts
          path: |
            dist/*.dmg
            dist/*.streamDeckPlugin

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm install
          npm --prefix streamdeck-plugin install

      - name: Build Stream Deck Plugin & Windows EXE
        run: |
          npm run build:streamdeck
          npx electron-builder --win --publish never

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/*.exe

  publish-release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.dmg
            release-assets/*.exe
            release-assets/*.streamDeckPlugin
